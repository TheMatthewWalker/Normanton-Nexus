<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="./js/session-guard.js"></script>
  <title>Normanton Nexus · Sales</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- logistics.css supplies the shared tile-grid/result-section base styles —
       same reuse pattern production-nexus.html already uses (see its own
       <head>): the base tile system lives there, department pages just add
       their own colour theme + section tweaks on top. -->
  <link rel="stylesheet" href="./css/logistics.css">
  <link rel="stylesheet" href="./css/sales.css">
  <link rel="stylesheet" href="./css/production-schedule.css">
  <link rel="stylesheet" href="./css/nexus-common.css">
  <link rel="stylesheet" href="./css/notifications.css">
  <script src="./js/notifications.js" defer></script>
  <script src="./js/deploy-banner.js" defer></script>
  <link rel="icon" href="/images/logo16.png">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="brand-icon"><img src="./images/logo32.png" alt="Kongsberg Logo"></div>
      <a href="./landing.html" class="back-link">&larr; Hub</a>
      <div class="brand-sep"></div>
      <div class="dept-badge">
        <svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="11" stroke="currentColor" stroke-width="1.8"/><circle cx="14" cy="14" r="6" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="14" r="2" fill="currentColor"/></svg>
      </div>
      <span class="brand-name">Sales</span>
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-dot"></div>
        <span id="session-user">Connected</span>
      </div>
      <a href="/logout" class="btn-logout">Sign Out</a>
    </div>
  </header>

  <!-- PAGE TITLE BAR -->
  <div class="page-title-bar">
    <div class="page-title-inner">
      <h1 class="page-title">Sales</h1>
      <p class="page-subtitle">Orders, customers &amp; pipeline · Select a function to begin</p>
    </div>
  </div>

  <!-- MAIN -->
  <div class="sap-main">

    <!-- TILE GRID -->
    <div class="tile-section" id="tile-section">

      <div class="pn-section">
        <div class="pn-section-hdr">Orders</div>
        <div class="tile-grid">
          <div class="sap-tile sap-tile--live" data-fn="productionSchedule">
            <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
            <span class="tile-badge tile-badge--live">LIVE</span>
            <div class="tile-title">Production Schedule</div>
            <div class="tile-desc">Open PTFE order lines due in the next 5 working days · Arrears · OTIF KPI</div>
          </div>
        </div>
      </div>

    </div>

    <!-- RESULT PANEL (shared across all functions) -->
    <div class="result-section hidden" id="result-section">
      <div class="result-toolbar">
        <button type="button" class="btn-back-tiles" id="btn-back-tiles">&larr; Functions</button>
        <div class="result-title-wrap">
          <div class="toolbar-title" id="result-title">—</div>
          <div class="toolbar-hint"  id="result-hint"></div>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="row-badge hidden" id="result-row-badge"></div>
      </div>
      <div class="result-body" id="result-body">
        <div class="psched-loading"><div class="psched-spinner"></div>Loading…</div>
      </div>
    </div>

  </div><!-- /.sap-main -->

  <footer class="footer">
    <span>Normanton Nexus &nbsp;&middot;&nbsp; Authorised access only</span>
    <span class="footer-right">Sales</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="./js/production-schedule.js"></script>
  <script src="./js/sales.js"></script>

</body>
</html>
